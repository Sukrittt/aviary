# Keeps the API's functions booted so users don't wait on a cold start (1.9s
# measured after ~10 idle minutes; a warm request is ~110ms). The 5-minute
# timer is a Vercel cron now (vercel.json, Pro). This workflow only pings
# right after a prod deploy, which a Vercel cron can't react to.
#
# Vercel bundles the API into one function per maxDuration (see
# `vercel build`, .vercel/output/functions). Each ping warms one:
#   /api/cron/warm     the core API (every route without a maxDuration),
#                      plus its Mongo pool
#   /api/cron/warm/30  maxDuration 30: brief, category suggest, feedback,
#                      holdings predict-type, habit nudges, split buckets
#   /api/cron/warm/60  maxDuration 60: scan, chat, bills, recurring
#                      suggestions, imports
# Add a warm route (and a cron in vercel.json) if a new maxDuration value
# creates a new function.
#
# ponytail: if we drop back to Vercel Hobby (crons once a day), revert the PR
# that moved the timer off this workflow's `schedule:`.
name: Keep API warm

on:
  workflow_dispatch:
  # Each production deploy starts every function cold, and the 5-minute cron
  # can leave the first users on the new build waiting up to 5 minutes for it.
  # Vercel reports deploys to GitHub, so ping as soon as one goes live.
  deployment_status:

permissions: {}

jobs:
  ping:
    if: github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && startsWith(github.event.deployment.environment, 'Production'))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping each function
        env:
          BASE: https://ynab-replacement.vercel.app
        run: |
          ping() { curl -sS -o /dev/null --max-time 30 -w "%{http_code} %{time_total}s $*\n" "$@" || echo "failed $*"; }
          ping "$BASE/api/cron/warm"
          ping "$BASE/api/cron/warm/30"
          ping "$BASE/api/cron/warm/60"
