name: Test

on:
  push:
    branches: [main, staging]
  pull_request:

jobs:
  test:
    # Pinned: mongod 8.2.6 ships builds per Ubuntu release, and ubuntu-latest
    # is moving to 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # mongodb-memory-server keeps its mongod in ~/.cache/mongodb-binaries.
      # The version tests run lives in src/test-utils/mongo.ts.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json', 'src/test-utils/mongo.ts') }}
          restore-keys: mongodb-binaries-${{ runner.os }}-
      # Skip the postinstall download of the library's default mongod; tests
      # fetch the version they pin on first use.
      - run: npm ci
        env:
          MONGOMS_DISABLE_POSTINSTALL: '1'
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
